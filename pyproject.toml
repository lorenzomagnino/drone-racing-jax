[project]
name = "drone-racing-jax"
version = "0.1.0"
description = "JAX port of Strategizing at Speed: differentiable open-loop racing game"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["jax", "optax", "matplotlib", "hydra-core"]

[dependency-groups]
dev = ["ruff", "black", "pytest", "pre-commit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.black]
line-length = 100
target-version = ["py310"]
extend-exclude = "/reference/"

[tool.pytest.ini_options]
testpaths = ["tests"]
